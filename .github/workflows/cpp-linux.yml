name: C++ Linux Release

on:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'examples/**'
      - 'tests/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '.github/workflows/cpp-linux.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'examples/**'
      - 'tests/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '.github/workflows/cpp-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
  VCPKG_DEFAULT_TRIPLET: x64-linux

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build autoconf automake bison flex \
            libtool pkg-config perl curl zip unzip tar

      - name: Install vcpkg
        id: vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          echo "baseline=$(git -C "$VCPKG_ROOT" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/downloads
            ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'third_party/vcpkg-overlays/mlspp/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Set manifest baseline
        env:
          BASELINE: ${{ steps.vcpkg.outputs.baseline }}
        run: |
          python3 - <<'EOF'
          import json
          import os

          with open("vcpkg.json") as handle:
              manifest = json.load(handle)
          manifest["builtin-baseline"] = os.environ["BASELINE"]
          with open("vcpkg.json", "w") as handle:
              json.dump(manifest, handle, indent=2)
          EOF

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -flto=auto -march=native -fno-plt" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -flto=auto -march=native -fno-plt" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto=auto -static-libstdc++ -static-libgcc -Wl,-O1"

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Verify DAVE
        run: ./build/VoiceDaveTest

      - name: Package
        run: |
          mkdir -p dist
          strip --strip-all build/VoicePlay build/VoiceDaveTest
          cp build/VoicePlay dist/
          cp build/VoiceDaveTest dist/
          cp third_party/LICENSE dist/LICENSE-libdave
          for License in openssl mlspp nlohmann-json; do
            Source="build/vcpkg_installed/x64-linux/share/$License/copyright"
            if [ -f "$Source" ]; then
              cp "$Source" "dist/LICENSE-$License"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoicePlay-linux-x86_64
          path: dist/
          if-no-files-found: error
